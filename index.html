<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gato Voxel em ASCII 3D</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            background-color: #000;
            color: #0f0; /* Verde estilo terminal/Matrix */
            font-family: 'Courier New', Courier, monospace;
            overflow: hidden;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
        }

        #ascii-container {
            white-space: pre;
            line-height: 10px; /* Ajuste para o aspecto dos caracteres */
            font-size: 10px;
            font-weight: bold;
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
        }

        #ui {
            position: absolute;
            bottom: 20px;
            left: 20px;
            color: #fff;
            background: rgba(0, 0, 0, 0.7);
            padding: 10px;
            border: 1px solid #0f0;
            font-family: sans-serif;
            font-size: 14px;
            z-index: 10;
        }
    </style>
    <!-- Importando Three.js para os cálculos de física, luz, oclusão e projeção de câmera (raios) -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
</head>
<body>

    <div id="ascii-container"></div>
    <div id="ui">
        <strong>Controles:</strong><br>
        W / S : Andar para frente e para trás<br>
        A / D : Virar à esquerda e à direita<br>
        <em>O mundo é um quarto enorme renderizado em ASCII!</em>
    </div>

    <script>
        // --- 1. CONFIGURAÇÕES INICIAIS DO MOTOR 3D ---
        const scene = new THREE.Scene();
        scene.background = new THREE.Color(0x000000);
        scene.fog = new THREE.Fog(0x000000, 20, 60); // Efeito de neblina (escuridão) ao longe

        // A câmera que projeta a visão 3D
        const camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 0.1, 1000);
        
        // Renderizador WebGL invisível, usado apenas para calcular as oclusões, luz e cores
        const renderer = new THREE.WebGLRenderer({ preserveDrawingBuffer: true });
        renderer.shadowMap.enabled = true;
        renderer.shadowMap.type = THREE.PCFSoftShadowMap;
        
        // --- 2. CONFIGURAÇÃO DO RENDERIZADOR ASCII ---
        const asciiContainer = document.getElementById('ascii-container');
        // Rampa de caracteres do mais escuro (espaço) ao mais claro (@)
        const ramp = " .',:;clodxkO0KXNWM@".split(''); 
        
        let cols, rows, pixels;
        let charW = 6;  // Largura estimada do caractere monospace
        let charH = 10; // Altura estimada do caractere monospace

        function setupAsciiGrid() {
            // Calcula quantas letras cabem na tela
            cols = Math.floor(window.innerWidth / charW);
            rows = Math.floor(window.innerHeight / charH);
            
            // Define a resolução real de cálculo de luz/oclusão baseada na quantidade de caracteres
            renderer.setSize(cols, rows);
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            
            // Buffer de pixels para ler os raios projetados no canvas WebGL
            pixels = new Uint8Array(cols * rows * 4);
        }
        setupAsciiGrid();
        window.addEventListener('resize', setupAsciiGrid);

        // --- 3. CRIANDO O QUARTO ENORME ---
        // Materiais básicos
        const matFloor = new THREE.MeshStandardMaterial({ color: 0x333333, roughness: 0.8 });
        const matWall = new THREE.MeshStandardMaterial({ color: 0x555555, roughness: 0.9 });
        const matWood = new THREE.MeshStandardMaterial({ color: 0x4a3018, roughness: 0.7 });
        const matFabric = new THREE.MeshStandardMaterial({ color: 0xaa2222, roughness: 1.0 });
        const matRug = new THREE.MeshStandardMaterial({ color: 0x2244aa, roughness: 1.0 });

        const roomSize = 60;
        const wallHeight = 25;

        // Chão
        const floorGeo = new THREE.BoxGeometry(roomSize, 1, roomSize);
        const floor = new THREE.Mesh(floorGeo, matFloor);
        floor.position.y = -0.5;
        floor.receiveShadow = true;
        scene.add(floor);

        // Paredes
        const createWall = (w, h, d, x, z) => {
            const wall = new THREE.Mesh(new THREE.BoxGeometry(w, h, d), matWall);
            wall.position.set(x, h/2, z);
            wall.receiveShadow = true;
            wall.castShadow = true;
            scene.add(wall);
            return wall;
        };
        createWall(roomSize, wallHeight, 1, 0, -roomSize/2); // Norte
        createWall(roomSize, wallHeight, 1, 0, roomSize/2);  // Sul
        createWall(1, wallHeight, roomSize, -roomSize/2, 0); // Oeste
        createWall(1, wallHeight, roomSize, roomSize/2, 0);  // Leste

        // Tapete
        const rug = new THREE.Mesh(new THREE.BoxGeometry(20, 0.2, 30), matRug);
        rug.position.set(0, 0.1, 0);
        rug.receiveShadow = true;
        scene.add(rug);

        // Cama
        const bedGroup = new THREE.Group();
        const bedBase = new THREE.Mesh(new THREE.BoxGeometry(12, 3, 20), matWood);
        bedBase.position.y = 1.5;
        bedBase.castShadow = true; bedBase.receiveShadow = true;
        const mattress = new THREE.Mesh(new THREE.BoxGeometry(11, 2, 19), matFabric);
        mattress.position.y = 3.5;
        mattress.castShadow = true; mattress.receiveShadow = true;
        const pillow = new THREE.Mesh(new THREE.BoxGeometry(8, 1, 4), new THREE.MeshStandardMaterial({color: 0xffffff}));
        pillow.position.set(0, 4.5, -7);
        pillow.castShadow = true; pillow.receiveShadow = true;
        bedGroup.add(bedBase, mattress, pillow);
        bedGroup.position.set(-18, 0, -10);
        scene.add(bedGroup);

        // Armário
        const wardrobe = new THREE.Mesh(new THREE.BoxGeometry(10, 18, 8), matWood);
        wardrobe.position.set(20, 9, -15);
        wardrobe.castShadow = true; wardrobe.receiveShadow = true;
        scene.add(wardrobe);

        // Estante de Livros
        const bookshelfGroup = new THREE.Group();
        const shelfGeo = new THREE.BoxGeometry(8, 0.5, 4);
        for(let i=0; i<5; i++) {
            const shelf = new THREE.Mesh(shelfGeo, matWood);
            shelf.position.y = 2 + i * 3.5;
            shelf.castShadow = true; shelf.receiveShadow = true;
            bookshelfGroup.add(shelf);
        }
        const sideGeo = new THREE.BoxGeometry(0.5, 18, 4);
        const leftSide = new THREE.Mesh(sideGeo, matWood); leftSide.position.set(-3.75, 9, 0);
        const rightSide = new THREE.Mesh(sideGeo, matWood); rightSide.position.set(3.75, 9, 0);
        leftSide.castShadow = true; rightSide.castShadow = true;
        leftSide.receiveShadow = true; rightSide.receiveShadow = true;
        bookshelfGroup.add(leftSide, rightSide);
        bookshelfGroup.position.set(-15, 0, 20);
        bookshelfGroup.rotation.y = Math.PI / 2;
        scene.add(bookshelfGroup);

        // Janela (Painel brilhante simulando a luz de fora)
        const windowGeo = new THREE.BoxGeometry(1, 10, 10);
        const windowMat = new THREE.MeshBasicMaterial({ color: 0xddddff }); // Material que não reage a sombra, parece emissivo
        const windowMesh = new THREE.Mesh(windowGeo, windowMat);
        windowMesh.position.set(roomSize/2 - 0.2, 12, 10);
        scene.add(windowMesh);

        // Luzes
        const ambientLight = new THREE.AmbientLight(0x404040, 1.5); // Luz suave em tudo
        scene.add(ambientLight);

        // Luz entrando pela janela
        const windowLight = new THREE.PointLight(0xaabbff, 1.5, 80);
        windowLight.position.set(roomSize/2 - 2, 12, 10);
        windowLight.castShadow = true;
        windowLight.shadow.bias = -0.001;
        scene.add(windowLight);
        
        // Luz no teto
        const ceilingLight = new THREE.PointLight(0xffddaa, 0.8, 60);
        ceilingLight.position.set(0, 20, 0);
        ceilingLight.castShadow = true;
        scene.add(ceilingLight);

        // --- 4. O GATO VOXEL ---
        const catGroup = new THREE.Group();
        const catColor = 0xffa500; // Laranja
        const matCat = new THREE.MeshStandardMaterial({ color: catColor, roughness: 0.5 });
        const catLegs = [];

        function createVoxel(w, h, d, x, y, z) {
            const mesh = new THREE.Mesh(new THREE.BoxGeometry(w, h, d), matCat);
            mesh.position.set(x, y, z);
            mesh.castShadow = true;
            mesh.receiveShadow = true;
            catGroup.add(mesh);
            return mesh;
        }

        // Corpo
        createVoxel(1.2, 1.0, 2.5, 0, 1.0, 0);
        // Cabeça
        createVoxel(1.4, 1.2, 1.4, 0, 1.8, 1.2);
        // Orelhas
        createVoxel(0.3, 0.5, 0.3, -0.4, 2.5, 1.5);
        createVoxel(0.3, 0.5, 0.3, 0.4, 2.5, 1.5);
        // Cauda
        const tail = createVoxel(0.3, 2.0, 0.3, 0, 1.5, -1.3);
        tail.rotation.x = -Math.PI / 5;
        
        // Pernas (para animação)
        catLegs.push(createVoxel(0.4, 0.8, 0.4, -0.4, 0.4, 1.0));  // Frontal Esquerda
        catLegs.push(createVoxel(0.4, 0.8, 0.4, 0.4, 0.4, 1.0));   // Frontal Direita
        catLegs.push(createVoxel(0.4, 0.8, 0.4, -0.4, 0.4, -0.8)); // Traseira Esquerda
        catLegs.push(createVoxel(0.4, 0.8, 0.4, 0.4, 0.4, -0.8));  // Traseira Direita

        scene.add(catGroup);
        catGroup.position.set(0, 0, 0);

        // --- 5. CONTROLES E LÓGICA DE MOVIMENTO ---
        const keys = { w: false, a: false, s: false, d: false };
        window.addEventListener('keydown', (e) => {
            const k = e.key.toLowerCase();
            if (keys.hasOwnProperty(k)) keys[k] = true;
        });
        window.addEventListener('keyup', (e) => {
            const k = e.key.toLowerCase();
            if (keys.hasOwnProperty(k)) keys[k] = false;
        });

        const gl = renderer.getContext();

        // --- 6. MOTOR PRINCIPAL DE PROCESSAMENTO ASCII E LOOP ---
        function animate() {
            requestAnimationFrame(animate);

            // --- Lógica de Movimento do Gato ---
            const moveSpeed = 0.3;
            const rotSpeed = 0.05;
            let isMoving = false;

            if (keys.w) { catGroup.translateZ(moveSpeed); isMoving = true; }
            if (keys.s) { catGroup.translateZ(-moveSpeed); isMoving = true; }
            if (keys.a) { catGroup.rotation.y += rotSpeed; }
            if (keys.d) { catGroup.rotation.y -= rotSpeed; }

            // Limites de colisão simplificados (para não sair do quarto)
            const limit = roomSize / 2 - 1.5;
            if (catGroup.position.x > limit) catGroup.position.x = limit;
            if (catGroup.position.x < -limit) catGroup.position.x = -limit;
            if (catGroup.position.z > limit) catGroup.position.z = limit;
            if (catGroup.position.z < -limit) catGroup.position.z = -limit;

            // Animação das pernas quando anda
            const time = Date.now() * 0.015;
            if (isMoving) {
                catLegs[0].rotation.x = Math.sin(time) * 0.6;
                catLegs[1].rotation.x = Math.sin(time + Math.PI) * 0.6;
                catLegs[2].rotation.x = Math.sin(time + Math.PI) * 0.6;
                catLegs[3].rotation.x = Math.sin(time) * 0.6;
            } else {
                catLegs.forEach(leg => leg.rotation.x = 0);
            }

            // --- Lógica da Câmera (Persegue o gato em terceira pessoa) ---
            // A câmera fica atrás e acima do gato
            const relativeOffset = new THREE.Vector3(0, 7, -12); 
            const cameraTargetPos = relativeOffset.applyMatrix4(catGroup.matrixWorld);
            camera.position.lerp(cameraTargetPos, 0.1); // Interpolação suave
            
            // Fazer a câmera olhar um pouco a frente do gato
            const lookAtPos = catGroup.position.clone();
            lookAtPos.y += 2;
            camera.lookAt(lookAtPos);

            // --- RENDERIZAÇÃO PARA ASCII ---
            // 1. Renderiza a cena 3D (calcula distâncias, raios de luz, oclusão)
            renderer.render(scene, camera);
            
            // 2. Lê os pixels gerados brutos do buffer da placa de vídeo (WebGL)
            gl.readPixels(0, 0, cols, rows, gl.RGBA, gl.UNSIGNED_BYTE, pixels);
            
            let asciiStr = "";
            // O WebGL lê de baixo para cima, então iteramos de forma invertida no eixo Y
            for (let y = rows - 1; y >= 0; y--) {
                for (let x = 0; x < cols; x++) {
                    // Pega o índice do Array (4 valores por pixel: R, G, B, A)
                    const index = (y * cols + x) * 4;
                    const r = pixels[index];
                    const g = pixels[index + 1];
                    const b = pixels[index + 2];
                    
                    // Converte RGB para Luminosidade (Escala de cinza matemática)
                    const luma = 0.299 * r + 0.587 * g + 0.114 * b;
                    
                    // Mapeia o valor (0 a 255) para a nossa string de rampa ASCII
                    const charIndex = Math.floor((luma / 255) * (ramp.length - 1));
                    asciiStr += ramp[charIndex];
                }
                asciiStr += "\n";
            }
            
            // 3. Atualiza a tela preenchendo o elemento pré-formatado HTML
            asciiContainer.textContent = asciiStr;
        }

        // Inicia o motor
        animate();
    </script>
</body>
</html>
